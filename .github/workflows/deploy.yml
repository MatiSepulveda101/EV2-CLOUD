name: Deploy ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_PAGOS_IMAGE: 828435023385.dkr.ecr.us-east-1.amazonaws.com/ev2-app-pagos
      APP_PAGOS_SERVICE: app-pagos-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # FRONTEND
      - name: Build frontend image
        run: |
          docker build -t ${{ secrets.ECR_FRONTEND }}:latest ./frontend

      - name: Push frontend image
        run: |
          docker push ${{ secrets.ECR_FRONTEND }}:latest

      # BACKEND
      - name: Build backend image
        run: |
          docker build -t ${{ secrets.ECR_BACKEND }}:latest ./backend

      - name: Push backend image
        run: |
          docker push ${{ secrets.ECR_BACKEND }}:latest

      # APP PAGOS
      - name: Ensure app-pagos ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names ev2-app-pagos || \
          aws ecr create-repository --repository-name ev2-app-pagos

      - name: Build app-pagos image
        run: |
          docker build -t $APP_PAGOS_IMAGE:latest ./microservicios/app-pagos

      - name: Push app-pagos image
        run: |
          docker push $APP_PAGOS_IMAGE:latest

      # DEPLOY FRONTEND
      - name: Deploy frontend service
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.ECS_FRONTEND_SERVICE }} \
            --force-new-deployment

      # DEPLOY BACKEND
      - name: Deploy backend service
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.ECS_BACKEND_SERVICE }} \
            --force-new-deployment

      # DEPLOY APP PAGOS
      - name: Deploy app-pagos service
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service $APP_PAGOS_SERVICE \
            --force-new-deployment
