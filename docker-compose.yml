services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    networks:
      - microservices-network
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped

  app-pagos:
    profiles:
      - payments
    build:
      context: ./microservicios/app-pagos
      dockerfile: Dockerfile
    container_name: app-pagos
    env_file:
      - ./backend/.env
    ports:
      - "8002:8002"
    networks:
      - microservices-network
    restart: unless-stopped

networks:
  microservices-network:
    driver: bridge

volumes:
  postgres_data:
